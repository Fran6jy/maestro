# Checks the MAESTRO live trial after each Foundation edition and on a matching schedule.
# A stale snapshot, a stopped loop, a loop error or missed bars fail the run,
# and GitHub emails the owner. The code comes from the public Fran6jy/maestro repo.
name: Check the live trial

on:
  schedule:
    - cron: "0 2 * * *"        # after Dawn
    - cron: "0 14 * * *"       # after Day
    - cron: "0 22 * * *"       # after Dusk
  push:
    paths: [snapshot.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: live

      - uses: actions/checkout@v5
        with:
          repository: Fran6jy/maestro
          path: maestro

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: live/requirements.txt

      - run: pip install -r live/requirements.txt

      - name: Check the latest snapshot
        run: python -m maestro.live.check live/snapshot.json
